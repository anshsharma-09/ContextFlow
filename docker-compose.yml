services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ContextFlowLocalDev_ChangeMe}
      MYSQL_DATABASE: contextflow_platform
    ports:
      - "3307:3306"
    volumes:
      - contextflow_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 5000
      FRONTEND_URL: http://localhost:5173
      NODE_ENV: production
      LOG_LEVEL: info
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ContextFlowLocalDev_ChangeMe}
      DB_NAME: contextflow_platform
      AI_PROVIDER: ${AI_PROVIDER:-demo}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
    ports:
      - "5000:5000"
    volumes:
      - ./backend/logs:/app/backend/logs
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  contextflow_mysql:
